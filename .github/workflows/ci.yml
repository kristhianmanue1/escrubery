# CI (T3, plan de deuda): build + lint (sin --fix) + tests (con PostgreSQL
# siempre activo — los specs de BD NUNCA se excluyen aquí) + gate de tamaños.
#
# DESACTIVADO como auto-trigger (2026-08-17): el billing de GitHub Actions
# se agotó (se renueva mensualmente). Mientras tanto el CI vigente es LOCAL:
# `scripts/ci_local.sh` (misma receta; ver docs/CI.md). Para re-activar la
# nube cuando haya presupuesto: cambiar `on:` de vuelta a
#   on: { push: {}, pull_request: {} }
# y verificar con `gh workflow run ci` (gh tiene scope admin en este repo).
name: ci

on:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESCRUBERY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escrubery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Lint (sin --fix)
        working-directory: backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Tests (PostgreSQL activo; specs de BD incluidas)
        working-directory: backend
        run: npm test
      - name: Gate de tamaños (politica-agentes §3)
        run: python3 scripts/check_sizes.py
